\* 237k states, about 15 seconds. bin/model-check rewrites N and Jobs to
\* check each size CI covers.
CONSTANTS
  N = 2
  Jobs = 2

SPECIFICATION Spec

INVARIANTS
  TypeOK
  VerdictAtMostOnce
  RequeueAtMostOnce
  RecheckOnFreshWorker
  FleetWithinJobs
  SlotsExclusive
  CanSpawn
  Conservation
  CompleteOnExit

PROPERTIES
  Termination
