\* Two mutants on two jobs, safety and liveness, no symmetry. bin/model-check
\* rewrites Ids and Slots for each size it checks, and for a safety run
\* drops PROPERTIES and adds SYMMETRY Symmetry.
CONSTANTS
  Ids = {i1, i2}
  Slots = {s1, s2}
  None = None
  Blocking = FALSE

SPECIFICATION Spec

INVARIANTS
  TypeOK
  VerdictAtMostOnce
  RequeueAtMostOnce
  RecheckOnFreshWorker
  FleetWithinJobs
  SlotsExclusive
  Framed
  Reaped
  CanSpawn
  Conservation
  CompleteOnExit

PROPERTIES
  Termination
