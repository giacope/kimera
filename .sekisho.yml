# Every kind on, and the strict set too: kimera holds itself to every kind and
# reading sekisho has. change_coupling reads the git history and crap the
# coverage results of a whole COVERAGE=1 bin/spec run; a run without them names
# them under "Not judged" and gates the rest.
strict: true
checks:
  all: true
boundaries:
  - root: Prism
    role: interpreted_model
    entrypoint: lib/kimera/parsing/syntax.rb
    reason: >-
      kimera scans source for mutation points by walking Prism's tree, so every operator tests its node
      types; Kimera::Syntax parses and hands the node classes out, and nothing else calls Prism
# Each suppression is a reviewed exception: raise this in the change that adds one.
max-suppressed: 0
