
plugins:
  - rubocop-kata

AllCops:
  TargetRubyVersion: 3.4
  Exclude:
    # Fixture apps: specs pin their exact source (lines, operators, mutant counts).
    - examples/**/*
    # CI matrix bundles: each reads the one gem version its job sets.
    - gemfiles/**/*
    # Evaluation fixtures hold the code under test, bad on purpose (one does
    # not parse); eval/tmp caches cloned projects.
    - eval/fixtures/**/*
    # The external holdout corpora and their oracle, kept as their authors wrote them.
    - eval/holdout/**/*
    - eval/holdout2/**/*
    - eval/tmp/**/*
    # CI installs the bundle here; replacing Exclude drops RuboCop's default.
    - vendor/**/*

# --------------------------------------------------------------------------
# Naming: words this domain owns, or that a framework spells its own way.
# --------------------------------------------------------------------------

Kata/GoodVariableName:
  AllowedNames:
    - $VERBOSE # Ruby's own global

Kata/GoodMethodName:
  AllowedNames:
    # ActiveSupport/ActiveRecord APIs that code and fixtures must match exactly.
    - set_callback
    - defined_enums
    - normalize_callback_params
    - get_callbacks
    - add_reflection
    - _reflections
    - clear_reflections_cache
    # RSpec and Minitest internals kimera extends each test with, to fail a test that calls exit.
    - with_around_example_hooks
    - capture_exceptions
    # Ruby's fork hook, which Process.fork calls and the coverage runtime prepends to.
    - _fork
    # Rails' controller action cache, which a visibility flip drops.
    - clear_action_methods!
    # unparser's range emitter internals, overridden to write array endpoints.
    - visit_begin_node
    - visit_end_node

Kata/GoodClassName:
  inherit_mode:
    merge:
      - AllowedNames
  AllowedNames:
    - Adapter # a boundary pattern, not a job

Kata/BuilderNoun:
  AllowedNames:
    - get_callbacks # ActiveSupport's private name, mirrored by a fixture


Naming/PredicateMethod:
  AllowedMethods:
    - run # overrides Minitest::Test#run

RSpec/SpecFilePathFormat:
  CustomTransform:
    RSpecAdapter: rspec_adapter # the cop wants r_spec_adapter

# --------------------------------------------------------------------------
# The cop ignores side effects between assignment and read (closing a pipe,
# starting a clock, forking). All 25 reports it ever made were such cases.
# --------------------------------------------------------------------------

Elegant/NoRedundantVariable:
  Enabled: false

# --------------------------------------------------------------------------
# Object discipline: state a contract outside kimera's objects dictates.
# --------------------------------------------------------------------------

Kata/NoOutputArgument:
  inherit_mode:
    merge:
      - AllowedNames
  AllowedNames:
    # eval/'s oracle: worker threads drain a shared work queue; pop is its thread-safe API.
    - queue
Kata/NoSetter:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    # The process-wide switches every synthesized guard and Rails-prepended guard module reads.
    - lib/kimera/runtime.rb
    - lib/kimera/execution/overlay_guards.rb
Kata/FrozenState:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    # The injected runtime: its selector and open ledgers change by design, with no allocation on the hot path.
    - lib/kimera/runtime.rb

# --------------------------------------------------------------------------
# kimera forks processes, not threads; a mutex here would only slow mutants.
# --------------------------------------------------------------------------

ThreadSafety/ClassInstanceVariable:
  Exclude:
    - spec/**/*
ThreadSafety/ClassAndModuleAttributes:
  Exclude:
    - spec/**/*
    # "Overlays armed?" flag, set once before any fork.
    - lib/kimera/execution/overlay_guards.rb
ThreadSafety/NewThread:
  Exclude:
    # The oracle runs one mutant per sandbox copy at once.
    - eval/lib/kimera_eval/oracle.rb
    # Reads a child's two streams and samples its memory while it runs.
    - eval/lib/kimera_eval/shell.rb
    # One thread per job is this file's purpose.
    - lib/kimera/execution/isolated_scheduling.rb
    # doctor waits on one suite process per job at once.
    - lib/kimera/cli/test_command.rb
Style/CaseEquality:
  Exclude:
    # Prism::Node#=== is structural equality (locations ignored), not a case match.
    - lib/kimera/operators/vocabulary.rb

# --------------------------------------------------------------------------
# Ruby source is this gem's data: fixtures, AST node types, asserted output.
# --------------------------------------------------------------------------

Lint/BooleanSymbol:
  Exclude:
    # :true/:false are AST node types.
    - lib/kimera/synthesis/guardrail_factories.rb

# --------------------------------------------------------------------------
# Spec-suite policy.
# --------------------------------------------------------------------------

# Each long example drives one real run; splitting re-runs it per assertion.
# Ratchet at the current longest.
RSpec/ExampleLength:
  Max: 21

# --------------------------------------------------------------------------
# CLI and report layers.
# --------------------------------------------------------------------------

Kata/RealWords:
  Terms:
    # `--format NAME` values.
    - ndjson
    - sarif
