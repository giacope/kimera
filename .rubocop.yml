
plugins:
  - sekisho

# kimera holds itself to sekisho's whole lint profile: the dogmatic one, the strict one under it.
inherit_gem:
  sekisho: config/dogmatic.yml

AllCops:
  TargetRubyVersion: 3.4
  SuggestExtensions: false
  Exclude:
    # Fixture apps: specs pin their exact source (lines, operators, mutant counts).
    - examples/**/*
    # Evaluation fixtures hold the code under test, bad on purpose (one does
    # not parse); eval/tmp caches cloned projects.
    - eval/fixtures/**/*
    # The external holdout corpora and their oracle, kept as their authors wrote them.
    - eval/holdout/**/*
    - eval/holdout2/**/*
    - eval/tmp/**/*
    # unparser's round-trip corpus, kept as its authors wrote it (three files do not parse).
    - spec/property/corpus/**/*
    # A vendored bundle (bundle config path vendor/bundle); replacing Exclude drops RuboCop's default.
    - vendor/**/*

Sekisho/FrozenState:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    # Kimera::Operators.register is the plugin API (examples/operators/README.md, "Wire them up"): a plugin file
    # named under `require:` registers its operator classes when kimera loads it, into the one roster every run
    # builds its operators from, and reset! puts back the built-ins. Nothing else hands kimera a plugin's
    # operators, so the roster changes after construction (plugin contract).
    - lib/kimera/operators/catalog.rb
    # Minitest runs a class's tests by handing each result to the reporter it is given, through #record, and
    # keeps nothing kimera can read after: the transcript a single test runs with has to collect what it is
    # handed (framework hook).
    - lib/kimera/frameworks/class_hooks.rb

Sekisho/RealWords:
  inherit_mode:
    merge:
      - AllowedNames
  AllowedNames:
    # Ruby calls RubyVM::InstructionSequence.load_iseq, when it is defined, for each file it loads; the weave
    # that guards a file as it first loads defines it, so the name is Ruby's (protocol).
    - load_iseq

Sekisho/GoodMethodName:
  inherit_mode:
    merge:
      - AllowedNames
  AllowedNames:
    # Active Record calls ConnectionHandler#discard_pool! on each pool a fork inherits; kimera's override keeps
    # the in-memory one, so the name is Active Record's (lib/kimera/execution/memory_databases.rb).
    - discard_pool!

# Each inline disable is a reviewed exception: raise this in the change that adds one.
Sekisho/JustifiedDirective:
  MaxDisables: 18
