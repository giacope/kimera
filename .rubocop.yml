
plugins:
  - rubocop-kata

AllCops:
  TargetRubyVersion: 3.4
  Exclude:
    # Fixture apps: specs pin their exact source (lines, operators, mutant counts).
    - examples/**/*
    # CI matrix bundles: each reads the one gem version its job sets.
    - gemfiles/**/*
    # Evaluation fixtures hold the code under test, bad on purpose (one does
    # not parse); eval/tmp caches cloned projects.
    - eval/fixtures/**/*
    # The external holdout corpora and their oracle, kept as their authors wrote them.
    - eval/holdout/**/*
    - eval/holdout2/**/*
    - eval/tmp/**/*
    # CI installs the bundle here; replacing Exclude drops RuboCop's default.
    - vendor/**/*

# --------------------------------------------------------------------------
# Until kata reads RSpec as one word (issues.md, OPEN; K10 covers the path).
# --------------------------------------------------------------------------

Kata/GoodClassName:
  inherit_mode:
    merge:
      - Terms
  Terms:
    - RSpecSuite

RSpec/SpecFilePathFormat:
  CustomTransform:
    RSpecSuite: rspec_suite # the cop wants r_spec_suite
