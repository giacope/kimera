name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bin/spec

  # hashira fails on any coupling/complexity/duplication/smell finding not in
  # hashira_baseline.json.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec hashira --ratchet

  # Self-gate: every mutant on the PR's changed lines killed and covered.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Mutation-test changed lines
        run: bundle exec kimera run --since origin/${{ github.base_ref }} --fail-on-no-coverage

  # Full self-host run (max_survivors: 0 via .kimera.yml); uploads the JSON
  # report. Trigger manually from the Actions tab.
  selfhost-report:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Full warm self-host
        run: bundle exec kimera run --report tmp/selfhost.json
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-report
          path: tmp/selfhost.json
