name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bin/spec

  # Exhaustive check of the worker-pool protocol model (formal/README.md).
  model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/cache@v4
        with:
          path: tmp/tla2tools.jar
          key: tla2tools-1.8.0
      - run: bin/model-check

  # Larger model instances (formal/README.md). Trigger manually from the
  # Actions tab.
  model-check-deep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/cache@v4
        with:
          path: tmp/tla2tools.jar
          key: tla2tools-1.8.0
      - run: bin/model-check --deep

  # hashira fails on any coupling/complexity/duplication/smell finding not in
  # hashira_baseline.json.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec hashira --ratchet

  # Self-gate: every mutant on the PR's changed lines killed and covered.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Mutation-test changed lines
        run: bundle exec kimera run --since origin/${{ github.base_ref }} --fail-on-no-coverage

  # Property specs at 10x their CI run counts, over a fresh seed and a wider
  # corpus sample. Trigger manually from the Actions tab.
  properties-deep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bin/spec spec/property
        env:
          PBT_SCALE: "10"

  # Full self-host run (max_survivors: 0 via .kimera.yml); uploads the JSON
  # report. Trigger manually from the Actions tab.
  selfhost-report:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Full warm self-host
        run: bundle exec kimera run --report tmp/selfhost.json
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-report
          path: tmp/selfhost.json
