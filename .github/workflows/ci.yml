name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # TLC validates the worker pool's traces in spec/property.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: tmp/tla2tools.jar
          key: tla2tools-1.7.4
      - run: bin/spec

  # Every supported unparser release: the unit suite and the schemata
  # properties, which exercise everything kimera re-emits.
  unparser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unparser: ["0.8.1", "0.8.2", "0.9.0"]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/unparser.gemfile
      UNPARSER: ${{ matrix.unparser }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # Specs that launch exe/kimera in this checkout use ./Gemfile, so install
      # its bundle beside this one.
      - run: bundle config set --local path vendor/bundle && bundle install
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
      - run: bin/spec spec/kimera spec/property/schemata_spec.rb

  # A real Rails app end to end (examples/rails_app): each mode's verdicts,
  # per-worker databases and --isolate-db included, against expected.json,
  # what a fresh bin/rails test (or rspec) says of each mutant.
  rails:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/rails_app
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: examples/rails_app
      - run: bin/e2e

  # The eval cases that need no network, Java or Rails app and whose result
  # does not ride on machine speed (eval/results/README.md). Fails when a case
  # fails that eval/results/after.json records passing; a new holdout case
  # goes in CASES. K12 is out until main stops adding top-level constants
  # (eval/results/README.md).
  eval:
    runs-on: ubuntu-latest
    env:
      CASES: H1,K1,K2,K4,K5,K6,K7,K11,X1
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      # The holdout oracle runs plain `rspec`, outside any bundle.
      - run: gem install rspec -v "~> 3.13" --no-document
      - run: ruby eval/run --kimera . --only "$CASES" --baseline eval/results/after.json --out tmp/eval.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: eval-scoreboard
          path: tmp/eval.json

  # Exhaustive check of the worker-pool protocol model (formal/README.md).
  model-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/cache@v4
        with:
          path: tmp/tla2tools.jar
          key: tla2tools-1.7.4
      - run: bin/model-check

  # Larger model instances (formal/README.md). Trigger manually from the
  # Actions tab.
  model-check-deep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/cache@v4
        with:
          path: tmp/tla2tools.jar
          key: tla2tools-1.7.4
      - run: bin/model-check --deep

  # hashira fails on any coupling/complexity/duplication/smell finding not in
  # hashira_baseline.json.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec hashira --ratchet

  # Self-gate: every mutant on the PR's changed lines killed and covered.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Mutation-test changed lines
        run: bundle exec kimera run --since origin/${{ github.base_ref }} --fail-on-no-coverage

  # Property specs at 10x their CI run counts, over a fresh seed and a wider
  # corpus sample. Trigger manually from the Actions tab.
  properties-deep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: tmp/tla2tools.jar
          key: tla2tools-1.7.4
      - run: bin/spec spec/property
        env:
          PBT_SCALE: "10"

  # Full self-host gate: every mutant in lib/ killed, covered and judged, with
  # no ignore entry (.kimera.yml: max_survivors 0, max_ignored 0,
  # fail_on_no_coverage). Runs on every push to main and from the Actions tab,
  # and uploads the JSON report either way.
  selfhost:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Full self-host run
        run: bundle exec kimera run --judge-isolated-only --report tmp/selfhost.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfhost-report
          path: tmp/selfhost.json
